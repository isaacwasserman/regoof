name: Publish

on:
  push:
    branches: [main]

jobs:
  canary:
    runs-on: ubuntu-latest
    concurrency:
      group: canary-release
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Set canary version
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          export SHA
          bun -e '
            const pkg = await Bun.file("package.json").json();
            const [major, minor, patch] = pkg.version.split("-")[0].split(".").map(Number);
            pkg.version = `${major}.${minor}.${patch + 1}-canary.${process.env.SHA}`;
            await Bun.write("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(`Publishing ${pkg.version}`);
          '
      - name: Publish canary
        run: npm publish --tag canary --provenance --access public

  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun changeset version
          publish: bun changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
